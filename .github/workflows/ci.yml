name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install (locked)
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Tests
        run: uv run pytest
