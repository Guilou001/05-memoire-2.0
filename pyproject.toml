[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memoire2"
version = "0.1.0"
description = "Mémoire 2.0 : la question du mémoire (UQAM, 2024) refaite selon l'état de l'art 2026 : alignement temps réel, validation croisée purgée combinatoire, coûts, Sharpe déflaté, caractéristiques par titre."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guillaume Vaudescal" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "pyarrow>=15",
  "typer>=0.12",
  "shap>=0.46",
  "yfinance>=0.2.40",
  "joblib",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
m2 = "memoire2.cli:app"

[project.urls]
Repository = "https://github.com/Guilou001/05-memoire-2.0"

[tool.hatch.build.targets.wheel]
packages = ["src/memoire2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
